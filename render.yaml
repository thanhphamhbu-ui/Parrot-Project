# Render Blueprint: one web service + one Postgres database.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: parrot-workflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: parrot-workflow-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Render asks for these two when you create the Blueprint.
      - key: PM_PASSWORD
        sync: false
      - key: TEAM_PASSWORD
        sync: false

databases:
  - name: parrot-workflow-db
    plan: free
    databaseName: parrot_workflow
    user: parrot
